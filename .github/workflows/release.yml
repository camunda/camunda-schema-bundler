name: Release

on:
  push:
    branches:
      - main
      - 'stable/**'
  # Build & Test runs on PRs so the "Require CI" ruleset's required checks
  # report before merge. The publish jobs below are skipped for PRs.
  pull_request:
  workflow_dispatch:

concurrency:
  group: camunda-schema-bundler-release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  # Superseded PR runs are cancelled; release runs on a branch never are.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  publish:
    name: Version & Publish (${{ github.ref_name }})
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      issues: write
      # npm trusted publishing (OIDC) and the Vault JWT for the App key
      id-token: write
    steps:
      - name: Import secrets
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_ID | APP_ID ;
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_PRIVATE_KEY | APP_PRIVATE_KEY ;

      # An App token, not GITHUB_TOKEN: semantic-release pushes the release
      # commit and tag straight to the branch, and only camunda-sdk-automation
      # is a bypass actor on the "Require CI" ruleset.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch remote refs for semantic-release
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git fetch origin '+refs/notes/*:refs/notes/*' || true

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish (semantic-release)
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # TODO: Enable provenance once the repo is public
          # NPM_CONFIG_PROVENANCE: true
        run: |
          npx semantic-release
          # Detect if a new release was created (tag on current commit)
          NEW_TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
    outputs:
      tag: ${{ steps.release.outputs.tag }}

  build-binaries:
    name: Build & Upload Binaries
    needs: publish
    if: needs.publish.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.tag }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install deps & build
        run: |
          npm ci
          npm run build

      - name: Compile binaries
        run: bash scripts/build-binaries.sh

      - name: Restore full dependencies
        run: npm ci

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in bin/camunda-schema-bundler-*; do
            echo "Uploading $f..."
            gh release upload "${{ needs.publish.outputs.tag }}" "$f" --clobber
          done
