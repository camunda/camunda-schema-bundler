name: CI

# Build and test on every pull request, including the integration test that
# bundles the real upstream spec. release.yml repeats this on push before
# publishing; this gate catches breakage (e.g. 2.5.0's createDeployment crash)
# before merge.
on:
  pull_request:
    branches:
      - main
      - 'stable/**'

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (unit + upstream-spec integration)
        run: npm test
        env:
          CAMUNDA_BUNDLER_INTEGRATION: '1'
