openapi: '3.0.3'
info:
  title: Search Models
  version: '1.0.0'
paths: {}
components:
  responses:
    # Shared across operations and files: SwaggerParser drops
    # components.responses and dedupes reuses into path-local $refs (#34).
    GatewayTimeout:
      description: The request timed out between the gateway and the broker.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  parameters:
    # Shared across operations and files: SwaggerParser drops
    # components.parameters and dedupes reuses into path-local $refs.
    KeyPathParam:
      name: key
      in: path
      required: true
      description: The resource key.
      schema:
        type: string
    DryRunQueryParam:
      name: dryRun
      in: query
      required: false
      description: Validate only.
      schema:
        type: boolean
  schemas:
    ProblemDetail:
      type: object
      properties:
        title:
          type: string
    SortOrderEnum:
      type: string
      enum: [ASC, DESC]
    OffsetPagination:
      type: object
      properties:
        from:
          type: integer
    SearchQueryRequest:
      type: object
      properties:
        size:
          type: integer
